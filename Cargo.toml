[package]
name = "vmvolume"
version = "0.2.0"
edition = "2021"
license = "GPL-3.0-only"
description = "Sync the Windows volume knob to Voicemeeter strip/bus gain"
repository = "https://github.com/awan-gh/VMVolume"
build = "build.rs"

[[bin]]
name = "VMVolume"
path = "src/main.rs"

[dependencies]
libloading = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
slint = { version = "1.18", default-features = false, features = ["std", "compat-1-2", "backend-winit", "renderer-software", "accessibility"] }
ureq = "2"
windows-core = "0.62"

[dependencies.windows]
version = "0.62"
features = [
  "Win32_Foundation", "Win32_Media_Audio", "Win32_Media_Audio_Endpoints", "Win32_System_Com",
  "Win32_System_Com_StructuredStorage", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell",
  "Win32_System_LibraryLoader", "Win32_System_Registry", "Win32_System_Threading", "Win32_Devices_FunctionDiscovery",
  "Win32_UI_Shell_PropertiesSystem", "Win32_Security", "Win32_Graphics_Gdi", "Win32_System_Variant",
  "Win32_System_Diagnostics_ToolHelp", "Win32_System_ProcessStatus",
]

[build-dependencies]
slint-build = "1.18"
winresource = "0.1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
